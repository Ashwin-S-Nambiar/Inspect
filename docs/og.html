<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Inspect · Share image</title>
  <style>
    @font-face { font-family: Inter; src: url('../src/assets/fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #fbfbfa; color: #171716; font-family: Inter, sans-serif; font-synthesis: none; -webkit-font-smoothing: antialiased; }
    main { position: relative; width: 1200px; height: 630px; }
    .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 440px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
    .brand img { width: 36px; height: 36px; }
    h1 { margin: 42px 0 20px; font-size: 43px; font-weight: 700; line-height: 1.12; letter-spacing: -.045em; }
    p { margin: 0; color: #74746e; font-size: 21px; line-height: 1.5; }
    .visual { position: absolute; left: 540px; top: 82px; width: 596px; height: 466px; border: 5px solid #efefeb; border-radius: 22px; overflow: hidden; background: #fbfbfa; }
    .visual img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <div class="brand"><img src="../public/icon.svg" alt="">Inspect</div>
      <h1>Write-ups on the<br>things I build</h1>
      <p>Why they changed, what went wrong, and the small details, pointed at.</p>
    </div>
    <div class="visual"><img src="./screenshots/Inspect-og.png" alt="Inspect's homepage with its writing list and tag filters"></div>
  </main>
</body>
</html>
